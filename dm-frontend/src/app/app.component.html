<!-- Navbar -->
<mat-toolbar class="dm-navbar">

  <!-- Brand -->
  <a class="dm-brand" routerLink="/">
    <img alt="Duel Masters" class="dm-logo" src="../assets/imgs/dm-logo.png">
  </a>

  <div class="dm-divider"></div>

  <!-- Center Navigation -->
  <nav class="dm-nav" aria-label="Main navigation">
    <a class="dm-nav__link"
       routerLink="/games/list"
       routerLinkActive="dm-nav__link--active"
       matTooltip="Official Card Game / Trading Card Game"
       *ngIf="this.socialUser">
      <span class="dm-nav__gem"></span>Play
    </a>
    <a class="dm-nav__link" routerLink="/rules" routerLinkActive="dm-nav__link--active">Rules</a>
    <a class="dm-nav__link" routerLink="/cards" routerLinkActive="dm-nav__link--active">Cards</a>
    <a class="dm-nav__link" routerLink="/" routerLinkActive="dm-nav__link--active" *ngIf="this.socialUser">Decks</a>
    <a class="dm-nav__link" routerLink="/" routerLinkActive="dm-nav__link--active" *ngIf="this.socialUser">Players</a>
  </nav>

  <span class="dm-spacer"></span>

  <!-- Theme Toggle -->
  <button class="dm-theme-toggle"
          (click)="themeService.toggle()"
          [attr.aria-label]="(themeService.isDark$ | async) ? 'Switch to light theme' : 'Switch to dark theme'"
          [matTooltip]="(themeService.isDark$ | async) ? 'Light mode' : 'Dark mode'">
    <svg class="dm-theme-toggle__icon dm-theme-toggle__moon"
         [class.dm-theme-toggle__icon--hidden]="!(themeService.isDark$ | async)"
         viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg class="dm-theme-toggle__icon dm-theme-toggle__sun"
         [class.dm-theme-toggle__icon--hidden]="(themeService.isDark$ | async)"
         viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  </button>

  <!-- Auth / Profile -->
  <div class="dm-auth">
    <ng-container *ngIf="this.socialUser">
      <div class="dm-profile">
        <div class="dm-profile__avatar">{{ socialUser.name?.charAt(0)?.toUpperCase() }}</div>
        <div class="dm-profile__details">
          <span class="dm-profile__name">{{ socialUser.name }}</span>
          <span class="dm-profile__email">{{ socialUser.email }}</span>
        </div>
        <button class="dm-logout" (click)="logout()" matTooltip="Sign out" aria-label="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </ng-container>
    <ng-container *ngIf="!this.socialUser">
      <div class="dm-signin">
        <asl-google-signin-button data-text="Login" size='medium' matTooltip="Log In"></asl-google-signin-button>
      </div>
    </ng-container>
  </div>

</mat-toolbar>

<!-- Body -->
<router-outlet></router-outlet>
