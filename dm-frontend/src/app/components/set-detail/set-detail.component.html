<div class="set-detail-wrap">

  <!-- ── Header ── -->
  <header class="set-header">
    <button class="back-btn" (click)="goBack()">
      <span class="back-btn__arrow">←</span>
      <span class="back-btn__label">All Sets</span>
    </button>
    <div class="set-header__info">
      <span class="set-header__code">{{ setCode }}</span>
      <span class="set-header__count" *ngIf="!loading && !error">{{ cards.length }} cards</span>
    </div>
  </header>

  <!-- ── Loading ── -->
  <div class="state-box" *ngIf="loading">
    <div class="spinner"></div>
    <p class="state-box__text">Loading cards…</p>
  </div>

  <!-- ── Error ── -->
  <div class="state-box state-box--error" *ngIf="error">
    <p class="state-box__text">Failed to load cards for <strong>{{ setCode }}</strong>.</p>
    <button class="retry-btn" (click)="ngOnInit()">Retry</button>
  </div>

  <!-- ── Empty ── -->
  <div class="state-box" *ngIf="!loading && !error && cards.length === 0">
    <p class="state-box__text">No cards found for <strong>{{ setCode }}</strong>.</p>
  </div>

  <!-- ── Card grid ── -->
  <div class="card-grid" *ngIf="!loading && !error && cards.length > 0">
    <div class="card-tile" *ngFor="let card of cards">
      <div class="card-tile__top">
        <div class="card-tile__civs">
          <span
            class="civ-dot"
            *ngFor="let civ of card.civilizations"
            [class]="'civ-dot--' + civ.toLowerCase()">
          </span>
        </div>
        <span class="card-tile__cost">{{ card.cost }}</span>
      </div>
      <p class="card-tile__name">{{ card.name }}</p>
      <div class="card-tile__meta">
        <span class="card-tile__type">{{ card.type }}</span>
        <span class="card-tile__power" *ngIf="card.power">{{ card.power }}</span>
      </div>
      <div class="card-tile__civs-label">
        <span *ngFor="let civ of card.civilizations; last as isLast">
          {{ civ }}<span *ngIf="!isLast"> / </span>
        </span>
      </div>
    </div>
  </div>

</div>
