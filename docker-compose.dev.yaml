version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: dm-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - dm-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: dm-backend
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/duel-masters
      - CORS_ORIGIN=http://localhost:4200
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./backend:/app
      - ./shared:/shared
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - dm-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: dm-frontend
    ports:
      - '4200:4200'
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - ./shared:/shared
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - dm-network
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  dm-network:
    driver: bridge
